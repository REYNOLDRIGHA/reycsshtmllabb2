<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Registration - FitLife Fitness Club</title>
    <link rel="stylesheet" href="csslab.css">
</head>
<body>

<header class="navbar">
    <div class="logo">FitLife <span>Fitness</span></div>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="programs.html">Programs</a>
        <a href="membership.html" class="active">Membership</a>
        <a href="trainers.html">Trainers</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="container">
    <section class="form-section">
        <h2>Membership Registration</h2>
        <p style="margin-bottom: 20px; color: #666;">Fill out the form below to start your premium fitness membership.</p>
        
        <!-- Updated action and method attributes -->
        <form class="contact-form" action="insert.php" method="POST">
            <div class="form-group">
                <label for="full_name">Full Name:</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age">
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="inline-options">
                    <label class="inline-label"><input type="radio" name="gender" value="Male"> Male</label>
                    <label class="inline-label"><input type="radio" name="gender" value="Female"> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label for="membership_type">Membership Type:</label>
                <select id="membership_type" name="membership_type">
                    <option value="Monthly">Monthly</option>
                    <option value="Quarterly">Quarterly</option>
                    <option value="Annual">Annual</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Programs:</label>
                <div class="checkbox-options">
                    <label class="inline-label"><input type="checkbox" name="programs[]" value="Weight Training"> Weight Training</label>
                    <label class="inline-label"><input type="checkbox" name="programs[]" value="Yoga"> Yoga</label>
                    <label class="inline-label"><input type="checkbox" name="programs[]" value="Zumba"> Zumba</label>
                    <label class="inline-label"><input type="checkbox" name="programs[]" value="Cardio Fitness"> Cardio Fitness</label>
                </div>
            </div>

            <div class="form-group">
                <label for="fitness_goals">Fitness Goals:</label>
                <textarea id="fitness_goals" name="fitness_goals" rows="5"></textarea>
            </div>

            <button type="submit" class="btn-submit">Register Now</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 FitLife Fitness Club. All rights reserved.</p>
</footer>
<!-- Link External JavaScript -->
<script src="script.js"></script>
</body>
</html>
