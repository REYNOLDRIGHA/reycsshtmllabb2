<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Registration - FitLife Fitness Club</title>
    <link rel="stylesheet" href="csslab.css">
</head>
<body>

<header class="navbar">
    <div class="logo">FitLife <span>Fitness</span></div>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="programs.html">Programs</a>
        <a href="membership.html" class="active">Membership</a>
        <a href="trainers.html">Trainers</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="container">
    <section class="form-section">
        <h2>Membership Registration</h2>
        <p style="margin-bottom: 20px; color: #666;">Fill out the form below to start your premium fitness membership.</p>
        
        <form class="contact-form">
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" required>
            </div>

            <div class="form-group">
                <label>Phone Number:</label>
                <input type="tel">
            </div>

            <div class="form-group">
                <label>Age:</label>
                <input type="number">
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="inline-options">
                    <label class="inline-label"><input type="radio" name="gender"> Male</label>
                    <label class="inline-label"><input type="radio" name="gender"> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Membership Type:</label>
                <select>
                    <option>Monthly</option>
                    <option>Quarterly</option>
                    <option>Annual</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Programs:</label>
                <div class="checkbox-options">
                    <label class="inline-label"><input type="checkbox"> Weight Training</label>
                    <label class="inline-label"><input type="checkbox"> Yoga</label>
                    <label class="inline-label"><input type="checkbox"> Zumba</label>
                    <label class="inline-label"><input type="checkbox"> Cardio Fitness</label>
                </div>
            </div>

            <div class="form-group">
                <label>Fitness Goals:</label>
                <textarea rows="5"></textarea>
            </div>

            <button type="submit" class="btn-submit">Register Now</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 FitLife Fitness Club. All rights reserved.</p>
</footer>
<!-- Link External JavaScript -->
<script src="script.js"></script>
</body>
</html>
